site_name: AI System Design Notes
site_description: >-
  A Staff-level reference for designing, scaling, and shipping production AI systems —
  LLM architecture, RAG, agents, AI infrastructure, LLMOps, security, and 20 full
  system-design case studies (ChatGPT, Claude, Perplexity, Cursor, Glean, and more).
site_author: Gyanendra Chaubey
site_url: https://gyanendrachaubey.github.io/AI-System-Design-Notes/
repo_name: AI-System-Design-Notes
repo_url: https://github.com/GyanendraChaubey/AI-System-Design-Notes
edit_uri: edit/main/docs/
copyright: Copyright &copy; Gyanendra Chaubey

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.path
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - def_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mermaid-fit.js
  - assets/javascripts/sidebar-toggle.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GyanendraChaubey/AI-System-Design-Notes

